name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Resolve Swift Packages
        run: |
          xcodebuild -resolvePackageDependencies -project DarockBili.xcodeproj -scheme "MeowBili Watch App" -skipMacroValidation

      - name: Build Watch App Archive
        run: |
          xcodebuild archive \
            -project DarockBili.xcodeproj \
            -scheme "MeowBili Watch App" \
            -destination "generic/platform=watchOS" \
            -archivePath "build/MeowBiliWatch.xcarchive" \
            CODE_SIGN_IDENTITY="-" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            SKIP_INSTALL=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            -skipMacroValidation

      - name: Build iOS Companion Host and Package IPA
        run: |
          # 1. Compile minimal iOS 16 compatible host binary
          xcrun --sdk iphoneos clang -arch arm64 -mios-version-min=16.0 -fobjc-arc -framework UIKit -framework Foundation iOSHost/main.m -o MeowBili
          codesign --force --sign - MeowBili

          # 2. Assemble standard iOS + watchOS bundle structure
          mkdir -p Payload/MeowBili.app/Watch
          cp iOSHost/Info.plist Payload/MeowBili.app/
          cp MeowBili Payload/MeowBili.app/

          # 3. Locate and embed compiled watch app
          APP_DIR=$(find build/MeowBiliWatch.xcarchive -name "*.app" -type d | head -n 1)
          if [ -z "$APP_DIR" ]; then
            APP_DIR=$(find /Users/runner/Library/Developer/Xcode/DerivedData -name "喵哩喵哩.app" -type d | head -n 1)
          fi
          echo "Found watch app at: $APP_DIR"
          cp -R "$APP_DIR" Payload/MeowBili.app/Watch/

          # 4. Verify Payload structure
          echo "=== Payload Structure ==="
          ls -la Payload/
          ls -la Payload/MeowBili.app/
          ls -la Payload/MeowBili.app/Watch/

          # 5. Package IPA
          zip -r -q MeowBili_iOS_and_Watch.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeowBili-IPA
          path: MeowBili_iOS_and_Watch.ipa
