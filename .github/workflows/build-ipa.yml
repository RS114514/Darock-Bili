name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Resolve Swift Packages
        run: |
          xcodebuild -resolvePackageDependencies -project DarockBili.xcodeproj -scheme "MeowBili" -skipMacroValidation

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project DarockBili.xcodeproj \
            -scheme "MeowBili" \
            -destination "generic/platform=iOS" \
            -archivePath "build/MeowBili.xcarchive" \
            CODE_SIGN_IDENTITY="-" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            -skipMacroValidation

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/MeowBili.xcarchive/Products/Applications/MeowBili.app Payload/
          
          if [ ! -d "Payload/MeowBili.app/Watch" ]; then
            echo "Watch directory not found in MeowBili.app, searching for compiled watch app..."
            mkdir -p Payload/MeowBili.app/Watch
            WATCH_APP=$(find build/MeowBili.xcarchive /Users/runner/Library/Developer/Xcode/DerivedData -name "*.app" | grep -v "MeowBili.app" | grep -i "喵哩喵哩" | head -n 1)
            if [ -n "$WATCH_APP" ]; then
              echo "Embedding watch app from $WATCH_APP"
              cp -R "$WATCH_APP" Payload/MeowBili.app/Watch/
            fi
          fi
          
          echo "Payload contents:"
          ls -la Payload/
          echo "MeowBili.app contents:"
          ls -la Payload/MeowBili.app/
          if [ -d "Payload/MeowBili.app/Watch" ]; then
            echo "Watch app contents:"
            ls -la Payload/MeowBili.app/Watch/
          fi
          
          zip -r -q MeowBili.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeowBili-IPA
          path: MeowBili.ipa
