name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Resolve Swift Packages
        run: |
          xcodebuild -resolvePackageDependencies -project DarockBili.xcodeproj -scheme "MeowBili Watch App" -skipMacroValidation

      - name: Build Watch App Archive
        run: |
          xcodebuild archive \
            -project DarockBili.xcodeproj \
            -scheme "MeowBili Watch App" \
            -destination "generic/platform=watchOS" \
            -archivePath "build/MeowBiliWatch.xcarchive" \
            CODE_SIGN_IDENTITY="-" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            SKIP_INSTALL=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            -skipMacroValidation

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_DIR=$(find build/MeowBiliWatch.xcarchive -name "*.app" -type d | head -n 1)
          if [ -z "$APP_DIR" ]; then
            APP_DIR=$(find /Users/runner/Library/Developer/Xcode/DerivedData -name "喵哩喵哩.app" -type d | head -n 1)
          fi
          echo "Found app at: $APP_DIR"
          cp -R "$APP_DIR" Payload/
          ls -la Payload/
          zip -r -q MeowBili_watchOS26.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeowBili-Watch-IPA
          path: MeowBili_watchOS26.ipa
