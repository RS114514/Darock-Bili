name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Resolve Swift Packages
        run: |
          xcodebuild -resolvePackageDependencies -project DarockBili.xcodeproj -scheme "MeowBili Watch App" -skipMacroValidation

      - name: Build Watch App Archive
        run: |
          xcodebuild archive             -project DarockBili.xcodeproj             -scheme "MeowBili Watch App"             -destination "generic/platform=watchOS"             -archivePath "build/MeowBiliWatch.xcarchive"             CODE_SIGN_IDENTITY="-"             AD_HOC_CODE_SIGNING_ALLOWED=YES             CODE_SIGNING_REQUIRED=NO             COMPILER_INDEX_STORE_ENABLE=NO             -skipMacroValidation

      - name: Package IPA
        run: |
          mkdir -p Payload
          find build/MeowBiliWatch.xcarchive/Products -name "*.app" -maxdepth 3 -exec cp -r {} Payload/ \;
          ls -la Payload/
          zip -r -q MeowBili_watchOS26.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeowBili-Watch-IPA
          path: MeowBili_watchOS26.ipa
