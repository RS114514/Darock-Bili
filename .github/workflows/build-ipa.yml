name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16 (Swift 6)
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Resolve Swift Packages
        run: |
          xcodebuild -resolvePackageDependencies -project DarockBili.xcodeproj -scheme "MeowBili" -skipMacroValidation

      - name: Build Archive
        run: |
          xcodebuild archive             -project DarockBili.xcodeproj             -scheme "MeowBili"             -destination "generic/platform=iOS"             -archivePath "build/MeowBili.xcarchive"             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             COMPILER_INDEX_STORE_ENABLE=NO             -skipMacroValidation

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/MeowBili.xcarchive/Products/Applications/MeowBili.app Payload/
          plutil -replace MinimumOSVersion -string "16.0" Payload/MeowBili.app/Info.plist
          zip -r -q MeowBili_iOS16_watchOS26.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeowBili-IPA
          path: MeowBili_iOS16_watchOS26.ipa
